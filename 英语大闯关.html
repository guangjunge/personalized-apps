<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语大闯关 V2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Comic Sans MS','Segoe UI',sans-serif}
body{background:#F0F4F8;display:flex;align-items:center;justify-content:center;user-select:none}
#app{width:100%;max-width:600px;height:100%;max-height:900px;position:relative;overflow:hidden;background:#FFF;border-radius:0;box-shadow:0 0 40px rgba(0,0,0,.08)}
@media(min-width:601px){#app{border-radius:20px;height:90vh}}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;transition:opacity .3s,transform .3s;overflow-y:auto}
.screen.hidden{opacity:0;transform:translateY(20px);pointer-events:none}

/* ===== 开始画面 扁平化 ===== */
#startScreen{align-items:center;justify-content:flex-start;padding:20px 20px 30px;text-align:center;background:linear-gradient(180deg,#E8F5E9 0%,#FFF 40%)}
.logo-area{margin-top:10px;margin-bottom:8px}
.logo-emoji{font-size:3.5em;animation:bounce 1.2s ease-in-out infinite;display:block;margin-bottom:4px}
.title{font-size:2em;color:#2D3436;font-weight:900;letter-spacing:2px;margin-bottom:2px}
.subtitle{font-size:.88em;color:#636E72;margin-bottom:12px;font-weight:500}
.name-input{width:240px;padding:12px 18px;border:3px solid #4ECDC4;border-radius:50px;font-size:1em;text-align:center;margin-bottom:14px;outline:none;background:#F8FFFF;transition:all .2s}
.name-input:focus{border-color:#FF6B6B;background:#FFF;box-shadow:0 0 0 4px rgba(255,107,107,.15)}
.info-card{background:#FFF;border-radius:16px;padding:14px 18px;margin-bottom:14px;width:100%;max-width:420px;border:2px solid #E0E0E0}
.info-card h3{color:#2D3436;margin-bottom:8px;font-size:1em;font-weight:800}
.info-card ul{list-style:none;text-align:left}
.info-card li{padding:3px 0;font-size:.85em;color:#636E72}
.info-card li .icon{display:inline-block;width:22px;text-align:center}

.grade-section{width:100%;max-width:420px;margin-bottom:14px}
.grade-label{font-size:.9em;font-weight:800;color:#2D3436;margin-bottom:8px;text-align:left}
.grade-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.grade-btn{padding:8px 12px;border:3px solid #E0E0E0;border-radius:12px;background:#FFF;font-size:.82em;font-weight:700;cursor:pointer;transition:all .15s;color:#636E72}
.grade-btn.active{border-color:#4ECDC4;background:#4ECDC4;color:#FFF;transform:scale(1.05)}
.grade-btn:hover{border-color:#4ECDC4;transform:scale(1.03)}
.grade-btn.active:hover{transform:scale(1.05)}

.diff-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.diff-btn{padding:10px 20px;border:3px solid #E0E0E0;border-radius:14px;background:#FFF;font-size:.92em;font-weight:700;cursor:pointer;transition:all .15s;color:#636E72;flex:1;max-width:130px}
.diff-btn.active{border-color:#FF6B6B;background:#FF6B6B;color:#FFF}
.diff-btn:hover{border-color:#FF6B6B}
.diff-btn.active:hover{transform:scale(1.02)}

.start-btn{padding:16px 60px;font-size:1.3em;font-weight:900;color:#FFF;background:#FF6B6B;border:none;border-radius:50px;cursor:pointer;transition:all .15s;letter-spacing:1px;box-shadow:0 4px 0 #E55A5A}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #E55A5A}
.start-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #E55A5A}

.voice-test{margin-top:10px;padding:8px 20px;border:2px solid #4ECDC4;border-radius:30px;background:#E8F8F7;font-size:.85em;font-weight:700;cursor:pointer;color:#00897B;transition:all .15s}
.voice-test:hover{background:#4ECDC4;color:#FFF}

/* ===== 游戏画面 ===== */
#gameScreen{padding:10px;background:linear-gradient(180deg,#FFF 0%,#F0F4F8 100%)}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 4px;flex-wrap:wrap;gap:4px}
.stat-item{display:flex;align-items:center;gap:4px;background:#FFF;border-radius:20px;padding:5px 12px;font-size:.85em;font-weight:700;color:#2D3436;border:2px solid #E0E0E0}
.stat-item .stat-icon{font-size:1.1em}
#scoreVal{color:#FF6B6B}
#comboVal{color:#FF9F43}
#comboVal.boost{animation:comboBoost .3s ease}
.lives{display:flex;gap:2px}
.life{font-size:1.2em;transition:all .3s}
.life.lost{opacity:.2;filter:grayscale(1);transform:scale(.7)}
.progress-wrap{width:100%;height:12px;background:#E0E0E0;border-radius:10px;margin:4px 0;overflow:hidden}
.progress-bar{height:100%;background:#4ECDC4;border-radius:10px;transition:width .4s ease;width:0}
.question-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-height:280px}
.category-badge{padding:4px 14px;border-radius:20px;font-size:.78em;font-weight:700;color:#FFF;margin-bottom:8px}
.qtype-badge{padding:3px 12px;border-radius:12px;font-size:.72em;font-weight:700;margin-bottom:10px;background:rgba(78,205,196,.15);color:#00897B}
.question-card{background:#FFF;border-radius:18px;padding:22px 28px;width:100%;max-width:450px;text-align:center;border:2px solid #E0E0E0;position:relative;overflow:hidden}
.question-card.correct-flash{animation:correctFlash .5s ease}
.question-card.wrong-shake{animation:wrongShake .4s ease}
.q-emoji{font-size:3.5em;margin-bottom:8px;animation:emojiBounce .6s ease}
.q-text{font-size:1.8em;font-weight:700;color:#2D3436;margin-bottom:6px;min-height:45px;display:flex;align-items:center;justify-content:center}
.q-hint{font-size:.82em;color:#B2BEC3;margin-top:4px}
.speak-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border:none;border-radius:30px;background:#45B7D1;color:#FFF;font-size:.95em;font-weight:700;cursor:pointer;margin-top:10px;transition:all .15s}
.speak-btn:hover{transform:scale(1.05)}
.speak-btn:active{transform:scale(.95)}
.speak-btn.playing{animation:soundWave .5s ease infinite}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px;width:100%;max-width:450px;margin-top:8px}
@media(max-width:400px){.options-grid{grid-template-columns:1fr}}
.option-btn{padding:14px 10px;border:3px solid #E0E0E0;border-radius:14px;background:#FFF;font-size:1.05em;font-weight:700;color:#2D3436;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;min-height:55px;display:flex;align-items:center;justify-content:center}
.option-btn:hover{border-color:#4ECDC4;transform:translateY(-2px)}
.option-btn:active{transform:scale(.96)}
.option-btn.correct{border-color:#96CEB4;background:#96CEB4;color:#FFF;animation:correctPop .4s ease}
.option-btn.wrong{border-color:#FF6B6B;background:#FF6B6B;color:#FFF}
.option-btn.disabled{pointer-events:none;opacity:.5}
.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4em;z-index:100;pointer-events:none;opacity:0}
.feedback.show{animation:feedbackPop .8s ease}
.combo-float{position:fixed;top:40%;left:50%;transform:translateX(-50%);font-size:2em;font-weight:700;color:#FF9F43;z-index:99;pointer-events:none;opacity:0}
.combo-float.show{animation:comboFloat 1s ease}

/* ===== 结束画面 ===== */
#endScreen{align-items:center;justify-content:center;padding:30px;text-align:center;background:linear-gradient(180deg,#E8F5E9 0%,#FFF 40%)}
.end-icon{font-size:4em;margin-bottom:10px;animation:bounce 1s ease-in-out infinite}
.end-title{font-size:1.8em;font-weight:900;color:#2D3436;margin-bottom:12px}
.stars{font-size:2.5em;margin-bottom:12px;letter-spacing:5px}
.star{display:inline-block;animation:starPop .5s ease backwards}
.star:nth-child(1){animation-delay:.1s}
.star:nth-child(2){animation-delay:.3s}
.star:nth-child(3){animation-delay:.5s}
.star.empty{filter:grayscale(1);opacity:.3}
.score-display{background:#FFF;border-radius:16px;padding:18px 28px;margin-bottom:12px;width:100%;max-width:380px;border:2px solid #E0E0E0}
.score-display .final-score{font-size:3em;font-weight:900;color:#FF6B6B}
.score-display .score-label{font-size:.85em;color:#636E72}
.stats-row{display:flex;justify-content:space-around;margin-top:10px}
.stat-box{text-align:center}
.stat-box .val{font-size:1.3em;font-weight:900;color:#2D3436}
.stat-box .lbl{font-size:.7em;color:#636E72;margin-top:2px}
.badges-section{margin-bottom:16px;width:100%;max-width:380px}
.badges-title{font-size:.95em;color:#636E72;margin-bottom:8px;font-weight:700}
.badges-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge{display:flex;flex-direction:column;align-items:center;padding:8px 10px;border-radius:12px;background:#F0F4F8;min-width:65px;transition:all .3s}
.badge.unlocked{background:#FFE66D;box-shadow:0 3px 0 #E6D35E;animation:badgePop .5s ease}
.badge.locked{opacity:.3}
.badge .b-icon{font-size:1.6em}
.badge .b-name{font-size:.62em;color:#2D3436;margin-top:2px;text-align:center;font-weight:700}
.replay-btn{padding:14px 40px;font-size:1.15em;font-weight:900;color:#FFF;background:#4ECDC4;border:none;border-radius:40px;cursor:pointer;box-shadow:0 4px 0 #3DBDB4;transition:all .15s}
.replay-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #3DBDB4}
.replay-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3DBDB4}

#particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:hidden}
.particle{position:absolute;font-size:1.5em;animation:particleFly 1.2s ease-out forwards}

@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes correctFlash{0%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 20px rgba(76,175,80,.5)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes feedbackPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@keyframes comboFloat{0%{opacity:0;transform:translateX(-50%) translateY(0) scale(.5)}30%{opacity:1;transform:translateX(-50%) translateY(-20px) scale(1.2)}100%{opacity:0;transform:translateX(-50%) translateY(-60px) scale(1)}}
@keyframes comboBoost{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes soundWave{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes emojiBounce{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes starPop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes particleFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-200px) translateX(var(--tx,0)) scale(.3) rotate(var(--rot,360deg))}}
@keyframes heartBreak{0%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(.8) rotate(-15deg)}100%{transform:scale(0) rotate(45deg);opacity:0}}
.screen::-webkit-scrollbar{display:none}
.screen{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body>

<div id="app">
  <div id="particles"></div>

  <div id="startScreen" class="screen">
    <div class="logo-area">
      <span class="logo-emoji">🎓</span>
    </div>
    <h1 class="title">英语大闯关</h1>
    <p class="subtitle">V2.0 — 从一年级到高中，快乐学英语！</p>

    <input type="text" class="name-input" id="playerName" placeholder="输入你的名字" maxlength="12">

    <div class="grade-section">
      <div class="grade-label">📚 选择年级</div>
      <div class="grade-row">
        <button class="grade-btn" data-grade="1">一年级</button>
        <button class="grade-btn" data-grade="2">二年级</button>
        <button class="grade-btn" data-grade="3">三年级</button>
        <button class="grade-btn active" data-grade="4">四年级</button>
        <button class="grade-btn" data-grade="5">五年级</button>
        <button class="grade-btn" data-grade="6">六年级</button>
        <button class="grade-btn" data-grade="7">初一</button>
        <button class="grade-btn" data-grade="8">初二</button>
        <button class="grade-btn" data-grade="9">初三</button>
        <button class="grade-btn" data-grade="10">高一</button>
        <button class="grade-btn" data-grade="11">高二</button>
        <button class="grade-btn" data-grade="12">高三</button>
      </div>
    </div>

    <div class="diff-row">
      <button class="diff-btn active" data-diff="easy">简单 10题</button>
      <button class="diff-btn" data-diff="medium">中等 20题</button>
      <button class="diff-btn" data-diff="hard">困难 30题</button>
    </div>

    <div class="info-card">
      <h3>🎮 游戏说明</h3>
      <ul>
        <li><span class="icon">🔊</span> 点击发音按钮播放真人发音</li>
        <li><span class="icon">🎧</span> 听力题会自动播放语音</li>
        <li><span class="icon">📝</span> 四选一答题，随机抽题</li>
        <li><span class="icon">🔥</span> 连续答对获得连击奖励</li>
        <li><span class="icon">❤️</span> 3条生命，答错扣血</li>
        <li><span class="icon">🏆</span> 答题解锁各种勋章</li>
      </ul>
    </div>

    <button class="start-btn" id="startBtn">🚀 开始闯关</button>
    <button class="voice-test" id="voiceTestBtn">🔊 测试发音</button>
  </div>

  <div id="gameScreen" class="screen hidden">
    <div class="top-bar">
      <div class="stat-item"><span class="stat-icon">⭐</span><span id="scoreVal">0</span></div>
      <div class="stat-item"><span class="stat-icon">🔥</span>连击 <span id="comboVal">0</span></div>
      <div class="stat-item lives" id="livesDisplay">
        <span class="life">❤️</span><span class="life">❤️</span><span class="life">❤️</span>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="question-area">
      <div class="category-badge" id="catBadge">类别</div>
      <div class="qtype-badge" id="qtypeBadge">题型</div>
      <div class="question-card" id="qCard">
        <div class="q-emoji" id="qEmoji" style="display:none"></div>
        <div class="q-text" id="qText"></div>
        <div class="q-hint" id="qHint"></div>
        <button class="speak-btn" id="speakBtn">🔊 点击播放</button>
      </div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
  </div>

  <div id="endScreen" class="screen hidden">
    <div class="end-icon" id="endIcon">🎉</div>
    <h2 class="end-title" id="endTitle">闯关成功！</h2>
    <div class="stars" id="endStars"></div>
    <div class="score-display">
      <div class="final-score" id="finalScore">0</div>
      <div class="score-label">总得分</div>
      <div class="stats-row">
        <div class="stat-box"><div class="val" id="statCorrect">0</div><div class="lbl">答对</div></div>
        <div class="stat-box"><div class="val" id="statTotal">0</div><div class="lbl">总题</div></div>
        <div class="stat-box"><div class="val" id="statMaxCombo">0</div><div class="lbl">最高连击</div></div>
        <div class="stat-box"><div class="val" id="statAccuracy">0%</div><div class="lbl">正确率</div></div>
      </div>
    </div>
    <div class="badges-section">
      <div class="badges-title">🏆 勋章成就</div>
      <div class="badges-grid" id="badgesGrid"></div>
    </div>
    <button class="replay-btn" id="replayBtn">🔄 再玩一次</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="combo-float" id="comboFloat"></div>
</div>

<script>
/* ===== 英语大闯关 V2.0 ===== */

function w(en,zh,emoji,g){return {en,zh,emoji,g}}

const wordBank = {
  '🍎 水果': [
    w('apple','苹果','🍎',1),w('banana','香蕉','🍌',1),w('orange','橙子','🍊',2),

  '🐱 动物': [
    w('cat','猫','🐱',1),w('dog','狗','🐶',1),w('bird','鸟','🐦',2),
    w('fish','鱼','🐟',2),w('rabbit','兔子','🐰',2),w('tiger','老虎','🐯',3),
    w('lion','狮子','🦁',3),w('elephant','大象','🐘',3),w('monkey','猴子','🐵',3),
    w('panda','熊猫','🐼',2),w('bear','熊','🐻',3),w('wolf','狼','🐺',4),

    w('cow','牛','🐮',3),w('sheep','羊','🐑',3),w('pig','猪','🐷',2),
    w('duck','鸭子','🦆',2),w('chicken','鸡','🐔',2),w('snake','蛇','🐍',4),
    w('frog','青蛙','🐸',3),w('turtle','乌龟','🐢',3),w('mouse','老鼠','🐭',2),
    w('kangaroo','袋鼠','🦘',5),w('giraffe','长颈鹿','🦒',5),w('zebra','斑马','🦓',5),
    w('dolphin','海豚','🐬',5),w('whale','鲸鱼','🐳',6),w('owl','猫头鹰','🦉',4),
    w('butterfly','蝴蝶','🦋',4),w('bee','蜜蜂','🐝',3),w('ant','蚂蚁','🐜',3),
    w('spider','蜘蛛','🕷️',5),w('shark','鲨鱼','🦈',6),w('eagle','鹰','🦅',6),
    w('parrot','鹦鹉','🦜',5),w('penguin','企鹅','🐧',5),w('camel','骆驼','🐪',7),
    w('crocodile','鳄鱼','🐊',7),w('gorilla','猩猩','🦍',8),
  ],
  '🎨 颜色': [
    w('red','红色','🔴',1),w('blue','蓝色','🔵',1),w('green','绿色','🟢',1),
    w('yellow','黄色','🟡',1),w('orange','橙色','🟠',2),w('purple','紫色','🟣',2),
    w('pink','粉色','🩷',2),w('black','黑色','⚫',1),w('white','白色','⚪',1),
    w('brown','棕色','🟤',3),w('gray','灰色','⬜',3),w('gold','金色','🟨',4),
    w('silver','银色','⬜',5),w('cyan','青色','🩵',6),w('magenta','品红','🟪',8),
    w('beige','米色','🟤',7),w('ivory','象牙色','🤍',9),w('crimson','深红','🔴',10),

  '🔢 数字': [
    w('one','一','1️⃣',1),w('two','二','2️⃣',1),w('three','三','3️⃣',1),
    w('four','四','4️⃣',1),w('five','五','5️⃣',1),w('six','六','6️⃣',1),

function initAudio(){
  if(!G.audioCtx){
    try{ G.audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(G.audioCtx && G.audioCtx.state==='suspended') G.audioCtx.resume();
}
function playTone(freq,duration,type='sine',vol=0.12,delay=0){
  if(!G.audioCtx) return;
  const osc=G.audioCtx.createOscillator(),gain=G.audioCtx.createGain();
  osc.type=type;osc.frequency.value=freq;
  const t=G.audioCtx.currentTime+delay;
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(vol,t+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
  osc.connect(gain);gain.connect(G.audioCtx.destination);
  osc.start(t);osc.stop(t+duration);
}

  combo(){[523,659,784,1047,1319].forEach((f,i)=>playTone(f,.1,'square',.08,i*.06))},

let synthVoices = [];
let speakResumeTimer = null;

function loadVoices(){
  if(!window.speechSynthesis) return;
  synthVoices = window.speechSynthesis.getVoices();
  G.voicesLoaded = synthVoices.length > 0;
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = function(){
    loadVoices();
  };
}

function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  clearInterval(speakResumeTimer);
  setTimeout(function(){
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    u.pitch = 1.0;
    u.volume = 1.0;
    if(synthVoices.length > 0){
      const enUS = synthVoices.find(function(v){return v.lang === 'en-US'});
      const enAny = synthVoices.find(function(v){return v.lang.startsWith('en')});
      if(enUS) u.voice = enUS;
      else if(enAny) u.voice = enAny;
    }
    const btn = document.getElementById('speakBtn');
    if(btn) btn.classList.add('playing');
    speakResumeTimer = setInterval(function(){
      if(window.speechSynthesis.speaking && !window.speechSynthesis.paused){
        // Chrome bug workaround: force resume periodically
      } else if(window.speechSynthesis.paused){
        window.speechSynthesis.resume();
      }
    }, 300);
    u.onend = function(){
      clearInterval(speakResumeTimer);
      if(btn) btn.classList.remove('playing');
    };
    u.onerror = function(e){
      clearInterval(speakResumeTimer);
      if(btn) btn.classList.remove('playing');
      // Retry once on error
      if(e.error !== 'interrupted' && e.error !== 'canceled'){
        setTimeout(function(){
          try{ window.speechSynthesis.speak(u); }catch(ex){}
        }, 200);
      }
    };
    try{
      window.speechSynthesis.speak(u);
    }catch(e){
      clearInterval(speakResumeTimer);
      if(btn) btn.classList.remove('playing');
    }
    // Chrome bug: speech may stop after ~15s, but single words are fine
    // Safety: clear resume timer after 5s
    setTimeout(function(){ clearInterval(speakResumeTimer); }, 5000);
  }, 150);
}

/* ===== 题目生成器 ===== */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function pickRandom(arr,n){return shuffle([...arr]).slice(0,n)}

function generateQuestions(count){
  const gradeMax = G.gradeLevel;
  const allWords = [];
  const catNames = Object.keys(wordBank);
  for(const cat of catNames){
    for(const w of wordBank[cat]){
      if(w.g <= gradeMax){
        allWords.push({...w, category:cat});
      }
    }
  }
  const allSentences = sentenceBank.filter(function(s){return s.g <= gradeMax});

  const questions = [];
  const usedIndices = new Set();
  let attempts = 0;
  const totalPool = allWords.length + allSentences.length;

  if(totalPool === 0) return questions;

  while(questions.length < count && attempts < count * 10){
    attempts++;
    const sentenceProb = allSentences.length > 0 ? 0.2 : 0;
    const useSentence = Math.random() < sentenceProb && allSentences.length > 0;

    if(useSentence){
      const idx = Math.floor(Math.random()*allSentences.length);
      const s = allSentences[idx];
      const distractors = pickRandom(allSentences.filter(function(x){return x!==s}),3).map(function(x){return x.zh});
      if(distractors.length < 3){
        const extra = allWords.slice(0,3-distractors.length).map(function(x){return x.zh});
        distractors.push(...extra);
      }
      const options = shuffle([s.zh,...distractors.slice(0,3)]);
      questions.push({
        type:'sentence',category:'📖 句子',
        english:s.en,chinese:s.zh,
        options,answer:s.zh,
        emoji:null,
      });
    } else {
      if(allWords.length === 0) continue;
      const idx = Math.floor(Math.random()*allWords.length);
      if(usedIndices.has(idx) && attempts < count*5) continue;
      usedIndices.add(idx);
      const wd = allWords[idx];
      const types = ['word','image','listening'];
      const type = types[Math.floor(Math.random()*types.length)];
      let pool = wordBank[wd.category].filter(function(x){return x.en!==wd.en && x.g<=gradeMax});
      if(pool.length < 3){
        pool = allWords.filter(function(x){return x.en!==wd.en});
      }
      const distractors = pickRandom(pool,3);
      if(distractors.length < 3){
        const needed = 3 - distractors.length;
        for(let i=0;i<needed && i<allWords.length;i++){
          if(allWords[i].en !== wd.en && !distractors.find(function(d){return d.en===allWords[i].en})){
            distractors.push(allWords[i]);
          }
        }
      }
      if(type === 'word'){
        const options = shuffle([wd.zh,...distractors.slice(0,3).map(function(d){return d.zh})]);
        questions.push({type:'word',category:wd.category,english:wd.en,chinese:wd.zh,options,answer:wd.zh,emoji:wd.emoji});
      } else if(type === 'image'){
        const options = shuffle([wd.en,...distractors.slice(0,3).map(function(d){return d.en})]);
        questions.push({type:'image',category:wd.category,english:wd.en,chinese:wd.zh,options,answer:wd.en,emoji:wd.emoji});
      } else {
        const options = shuffle([wd.en,...distractors.slice(0,3).map(function(d){return d.en})]);
        questions.push({type:'listening',category:wd.category,english:wd.en,chinese:wd.zh,options,answer:wd.en,emoji:null});
      }
    }
  }
  return questions;
}

function handleAnswer(btn,selected){
  if(G.answeredThisQ) return;
  G.answeredThisQ = true;
  const q = G.currentQ;
  const isCorrect = selected === q.answer;
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(function(b){b.classList.add('disabled')});

  if(isCorrect){
    btn.classList.add('correct');
    document.getElementById('qCard').classList.add('correct-flash');
    G.correctCount++;
    G.combo++;
    if(G.combo > G.maxCombo) G.maxCombo = G.combo;
    let points = 10;
    if(G.combo >= 3) points += 5;
    if(G.combo >= 5) points += 5;
    if(G.combo >= 10) points += 10;
    if(G.difficulty === 'medium') points = Math.round(points*1.5);
    if(G.difficulty === 'hard') points = Math.round(points*2);
    points += Math.floor(G.gradeLevel / 2);
    G.score += points;
    const elapsed = (Date.now()-G.qStartTime)/1000;
    if(elapsed < 3) G.fastAnswers++;
    if(G.combo >= 5 && G.combo % 5 === 0){
      sfx.combo(); showComboFloat(G.combo+'连击！+'+points);
    } else { sfx.correct(); }
    spawnParticles(btn);
    checkBadges();
    setTimeout(function(){nextQuestion()}, 1200);
  } else {
    btn.classList.add('wrong');
    document.getElementById('qCard').classList.add('wrong-shake');
    G.combo = 0; G.lives--;
    sfx.wrong();
    allBtns.forEach(function(b){if(b.textContent === q.answer) b.classList.add('correct')});
    const lifeEls = document.querySelectorAll('#livesDisplay .life');
    if(G.lives < lifeEls.length){ lifeEls[G.lives].style.animation = 'heartBreak .5s ease forwards'; }
    showFeedback('❌');
    if(G.lives <= 0){ setTimeout(function(){endGame(false)}, 1500); }
    else { setTimeout(function(){nextQuestion()}, 1800); }
  }
  updateStats();
}

  const containerRect = container.getBoundingClientRect();
  const cx = rect.left+rect.width/2-containerRect.left;
  const cy = rect.top+rect.height/2-containerRect.top;
  for(let i=0;i<8;i++){

/* ===== 游戏开始/结束 ===== */
function startGame(){
  initAudio();
  G.score=0;G.combo=0;G.maxCombo=0;G.lives=3;G.correctCount=0;G.currentIdx=0;
  G.fastAnswers=0;G.unlockedBadges=new Set();
  G.questionQueue = generateQuestions(G.totalQuestions);
  if(G.questionQueue.length === 0){
    alert('该年级暂无题库数据，请选择其他年级！');
    return;
  }
  G.currentQ = G.questionQueue[0];
  showScreen('gameScreen');
  renderQuestion();
}

function endGame(completed){
  if(completed){
    if(G.correctCount === G.totalQuestions) unlockBadge('perfect');
    if(G.lives === 3) unlockBadge('survive');
    if(G.difficulty === 'hard' && completed) unlockBadge('nohint');
  }
  sfx.levelup();
  const accuracy = G.totalQuestions > 0 ? Math.round(G.correctCount/G.totalQuestions*100) : 0;
  document.getElementById('finalScore').textContent = G.score;
  document.getElementById('statCorrect').textContent = G.correctCount;
  document.getElementById('statTotal').textContent = G.totalQuestions;
  document.getElementById('statMaxCombo').textContent = G.maxCombo;
  document.getElementById('statAccuracy').textContent = accuracy+'%';
  let stars = 1;
  if(accuracy >= 60) stars = 2;
  if(accuracy >= 85) stars = 3;
  if(!completed) stars = 0;
  const starsEl = document.getElementById('endStars');
  starsEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const s = document.createElement('span');
    s.className = 'star'+(i<stars?'':' empty');
    s.textContent = i<stars?'⭐':'☆';
    starsEl.appendChild(s);
  }
  const endIcon = document.getElementById('endIcon');
  const endTitle = document.getElementById('endTitle');
  if(!completed){endIcon.textContent='💔';endTitle.textContent='再接再厉！'}
  else if(stars===3){endIcon.textContent='🏆';endTitle.textContent='太棒了，满分通关！'}
  else if(stars===2){endIcon.textContent='🎉';endTitle.textContent='闯关成功！'}
  else{endIcon.textContent='😊';endTitle.textContent='继续努力！'}
  const badgesGrid = document.getElementById('badgesGrid');
  badgesGrid.innerHTML = '';
  badgeDefs.forEach(function(b){
    const el = document.createElement('div');
    const unlocked = G.unlockedBadges.has(b.id);
    el.className = 'badge '+(unlocked?'unlocked':'locked');
    el.innerHTML = '<div class="b-icon">'+b.icon+'</div><div class="b-name">'+b.name+'</div>';
    el.title = b.desc;
    badgesGrid.appendChild(el);
  });
  showScreen('endScreen');
}

    document.querySelectorAll('.diff-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    G.difficulty = btn.dataset.diff;
    G.totalQuestions = {easy:10,medium:20,hard:30}[G.difficulty];
    initAudio(); sfx.click();
  };
});

document.getElementById('startBtn').onclick = function(){
  G.playerName = document.getElementById('playerName').value.trim() || '小勇士';
  sfx.click(); startGame();
};

document.getElementById('speakBtn').onclick = function(){
  if(G.currentQ && G.currentQ.english){
    initAudio();
    speak(G.currentQ.english);
  }
};

document.getElementById('replayBtn').onclick = function(){
  sfx.click(); showScreen('startScreen');
};

document.getElementById('voiceTestBtn').onclick = function(){
  initAudio();
  loadVoices();
  speak('Hello, how are you?');
};

document.addEventListener('keydown', function(e){
  if(document.getElementById('gameScreen').classList.contains('hidden')) return;
  const key = parseInt(e.key);
  if(key >= 1 && key <= 4){
    const btns = document.querySelectorAll('.option-btn:not(.disabled)');
    if(btns[key-1]) btns[key-1].click();
  }
  if(e.key === ' '){
    e.preventDefault();
    if(G.currentQ && G.currentQ.english) speak(G.currentQ.english);
  }
});

window.addEventListener('load', function(){
  setTimeout(loadVoices, 300);
  setTimeout(loadVoices, 1000);
  setTimeout(loadVoices, 3000);
});

window._G = G;
</script>
</body>
</html>
