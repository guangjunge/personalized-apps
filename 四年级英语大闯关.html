<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>四年级英语大闯关 V1.0</title>
<style>
/* ===== 全局重置 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Comic Sans MS','Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;align-items:center;justify-content:center;user-select:none}

/* ===== 主容器 ===== */
#app{width:100%;max-width:600px;height:100%;max-height:900px;position:relative;overflow:hidden;background:linear-gradient(180deg,#87CEEB 0%,#E0F6FF 50%,#FFF9E6 100%);border-radius:0;box-shadow:0 0 30px rgba(0,0,0,.3)}
@media(min-width:601px){#app{border-radius:24px;height:90vh}}

/* ===== 屏幕通用 ===== */
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;transition:opacity .4s,transform .4s;overflow-y:auto}
.screen.hidden{opacity:0;transform:scale(.95);pointer-events:none}

/* ===== 开始画面 ===== */
#startScreen{align-items:center;justify-content:center;padding:30px;text-align:center}
.logo{font-size:3em;margin-bottom:10px;animation:bounce 1s ease-in-out infinite}
.logo span{display:inline-block;animation:wave 2s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:.1s}
.logo span:nth-child(3){animation-delay:.2s}
.logo span:nth-child(4){animation-delay:.3s}
.logo span:nth-child(5){animation-delay:.4s}
.logo span:nth-child(6){animation-delay:.5s}
.logo span:nth-child(7){animation-delay:.6s}
.logo span:nth-child(8){animation-delay:.7s}
.logo span:nth-child(9){animation-delay:.8s}
.logo span:nth-child(10){animation-delay:.9s}
.logo span:nth-child(11){animation-delay:1s}
.logo span:nth-child(12){animation-delay:1.1s}

.title{font-size:1.8em;color:#4A4A4A;text-shadow:2px 2px 0 #FFD700,3px 3px 6px rgba(0,0,0,.2);margin-bottom:6px;font-weight:bold}
.subtitle{font-size:1em;color:#666;margin-bottom:25px}

.info-card{background:rgba(255,255,255,.9);border-radius:16px;padding:18px 20px;margin-bottom:20px;width:100%;max-width:420px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.info-card h3{color:#4A4A4A;margin-bottom:10px;font-size:1.05em}
.info-card ul{list-style:none;text-align:left}
.info-card li{padding:4px 0;font-size:.9em;color:#555}
.info-card li .icon{display:inline-block;width:24px;text-align:center}

.difficulty-row{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.diff-btn{padding:10px 18px;border:3px solid transparent;border-radius:30px;background:#fff;font-size:.95em;font-weight:bold;cursor:pointer;transition:all .2s;color:#666}
.diff-btn.active{border-color:#FF6B6B;background:#FF6B6B;color:#fff;transform:scale(1.05)}
.diff-btn:hover{transform:scale(1.03)}

.start-btn{padding:16px 50px;font-size:1.4em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#FF6B6B,#FF8E53);border:none;border-radius:50px;cursor:pointer;box-shadow:0 6px 20px rgba(255,107,107,.4);transition:all .3s;animation:pulse 2s ease-in-out infinite}
.start-btn:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(255,107,107,.5)}
.start-btn:active{transform:scale(.95)}

.name-input{width:220px;padding:10px 16px;border:3px solid #FFD700;border-radius:30px;font-size:1em;text-align:center;margin-bottom:15px;outline:none;transition:border-color .2s}
.name-input:focus{border-color:#FF6B6B}

/* ===== 游戏画面 ===== */
#gameScreen{padding:12px}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;flex-wrap:wrap;gap:6px}
.stat-item{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.85);border-radius:20px;padding:5px 12px;font-size:.85em;font-weight:bold;color:#4A4A4A;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stat-item .stat-icon{font-size:1.1em}
#scoreVal{color:#FF6B6B}
#comboVal{color:#FF9F43}
#comboVal.boost{animation:comboBoost .3s ease}

.lives{display:flex;gap:2px}
.life{font-size:1.2em;transition:all .3s}
.life.lost{opacity:.2;filter:grayscale(1);transform:scale(.7)}

.progress-wrap{width:100%;height:14px;background:rgba(255,255,255,.6);border-radius:10px;margin:6px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#4CAF50,#8BC34A);border-radius:10px;transition:width .4s ease;width:0;position:relative}
.progress-bar::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 1.5s infinite}

.question-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;min-height:280px}

.category-badge{padding:4px 16px;border-radius:20px;font-size:.8em;font-weight:bold;color:#fff;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.qtype-badge{padding:3px 12px;border-radius:12px;font-size:.72em;font-weight:bold;margin-bottom:12px}

.question-card{background:#fff;border-radius:20px;padding:25px 30px;width:100%;max-width:450px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.1);position:relative;overflow:hidden}
.question-card.correct-flash{animation:correctFlash .5s ease}
.question-card.wrong-shake{animation:wrongShake .4s ease}

.q-emoji{font-size:4em;margin-bottom:10px;animation:emojiBounce .6s ease}
.q-text{font-size:2em;font-weight:bold;color:#333;margin-bottom:8px;min-height:50px;display:flex;align-items:center;justify-content:center}
.q-hint{font-size:.85em;color:#999;margin-top:6px}

.speak-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border:none;border-radius:30px;background:linear-gradient(135deg,#4FC3F7,#29B6F6);color:#fff;font-size:1em;font-weight:bold;cursor:pointer;margin-top:12px;box-shadow:0 3px 10px rgba(79,195,247,.4);transition:all .2s}
.speak-btn:hover{transform:scale(1.05)}
.speak-btn:active{transform:scale(.95)}
.speak-btn.playing{animation:soundWave .5s ease infinite}

.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;width:100%;max-width:450px;margin-top:10px}
@media(max-width:400px){.options-grid{grid-template-columns:1fr}}

.option-btn{padding:16px 12px;border:3px solid #E0E0E0;border-radius:16px;background:#fff;font-size:1.1em;font-weight:bold;color:#444;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;min-height:60px;display:flex;align-items:center;justify-content:center}
.option-btn:hover{border-color:#4FC3F7;transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,195,247,.25)}
.option-btn:active{transform:scale(.96)}
.option-btn.correct{border-color:#4CAF50;background:linear-gradient(135deg,#81C784,#66BB6A);color:#fff;animation:correctPop .4s ease}
.option-btn.wrong{border-color:#F44336;background:linear-gradient(135deg,#EF5350,#E53935);color:#fff}
.option-btn.disabled{pointer-events:none;opacity:.6}

.feedback{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:4em;z-index:100;pointer-events:none;opacity:0}
.feedback.show{animation:feedbackPop .8s ease}

.combo-float{position:fixed;top:40%;left:50%;transform:translateX(-50%);font-size:2em;font-weight:bold;color:#FF9F43;z-index:99;pointer-events:none;opacity:0}
.combo-float.show{animation:comboFloat 1s ease}

/* ===== 结束画面 ===== */
#endScreen{align-items:center;justify-content:center;padding:30px;text-align:center}
.end-icon{font-size:4em;margin-bottom:10px;animation:bounce 1s ease-in-out infinite}
.end-title{font-size:1.8em;font-weight:bold;color:#4A4A4A;margin-bottom:15px;text-shadow:2px 2px 0 #FFD700}
.stars{font-size:2.5em;margin-bottom:15px;letter-spacing:5px}
.star{display:inline-block;animation:starPop .5s ease backwards}
.star:nth-child(1){animation-delay:.1s}
.star:nth-child(2){animation-delay:.3s}
.star:nth-child(3){animation-delay:.5s}
.star.empty{filter:grayscale(1);opacity:.3}

.score-display{background:rgba(255,255,255,.9);border-radius:16px;padding:20px 30px;margin-bottom:15px;width:100%;max-width:380px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.score-display .final-score{font-size:3em;font-weight:bold;color:#FF6B6B}
.score-display .score-label{font-size:.9em;color:#888}
.stats-row{display:flex;justify-content:space-around;margin-top:12px}
.stat-box{text-align:center}
.stat-box .val{font-size:1.3em;font-weight:bold;color:#4A4A4A}
.stat-box .lbl{font-size:.72em;color:#999;margin-top:2px}

.badges-section{margin-bottom:20px;width:100%;max-width:380px}
.badges-title{font-size:1em;color:#666;margin-bottom:10px}
.badges-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.badge{display:flex;flex-direction:column;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.8);min-width:70px;transition:all .3s}
.badge.unlocked{background:linear-gradient(135deg,#FFD700,#FFA726);box-shadow:0 3px 10px rgba(255,167,38,.4);animation:badgePop .5s ease}
.badge.locked{opacity:.35}
.badge .b-icon{font-size:1.8em}
.badge .b-name{font-size:.65em;color:#555;margin-top:3px;text-align:center;font-weight:bold}

.replay-btn{padding:14px 40px;font-size:1.2em;font-weight:bold;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:40px;cursor:pointer;box-shadow:0 5px 15px rgba(102,126,234,.4);transition:all .2s}
.replay-btn:hover{transform:scale(1.05)}
.replay-btn:active{transform:scale(.95)}

/* ===== 粒子 ===== */
#particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:hidden}
.particle{position:absolute;font-size:1.5em;animation:particleFly 1.2s ease-out forwards}

/* ===== 装饰云朵 ===== */
.cloud{position:absolute;font-size:2em;opacity:.5;animation:cloudFloat 15s linear infinite;pointer-events:none}

/* ===== 动画 ===== */
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-5deg)}75%{transform:translateY(-4px) rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes correctFlash{0%{box-shadow:0 6px 20px rgba(0,0,0,.1)}30%{box-shadow:0 0 30px rgba(76,175,80,.6)}100%{box-shadow:0 6px 20px rgba(0,0,0,.1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes correctPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes feedbackPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@keyframes comboFloat{0%{opacity:0;transform:translateX(-50%) translateY(0) scale(.5)}30%{opacity:1;transform:translateX(-50%) translateY(-20px) scale(1.2)}100%{opacity:0;transform:translateX(-50%) translateY(-60px) scale(1)}}
@keyframes comboBoost{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes soundWave{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes emojiBounce{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes starPop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes particleFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-200px) translateX(var(--tx,0)) scale(.3) rotate(var(--rot,360deg))}}
@keyframes cloudFloat{0%{transform:translateX(-50px)}100%{transform:translateX(calc(100vw + 50px))}}
@keyframes heartBreak{0%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(.8) rotate(-15deg)}100%{transform:scale(0) rotate(45deg);opacity:0}}

/* 滚动条隐藏 */
.screen::-webkit-scrollbar{display:none}
.screen{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body>

<div id="app">
  <!-- 装饰云朵 -->
  <div class="cloud" style="top:8%;left:0;animation-delay:0s">☁️</div>
  <div class="cloud" style="top:20%;left:0;animation-delay:5s;font-size:1.5em">☁️</div>
  <div class="cloud" style="top:5%;left:0;animation-delay:10s;font-size:2.5em">☁️</div>

  <!-- 粒子层 -->
  <div id="particles"></div>

  <!-- ===== 开始画面 ===== -->
  <div id="startScreen" class="screen">
    <div class="logo">
      <span>英</span><span>语</span><span>大</span><span>闯</span><span>关</span>
    </div>
    <h1 class="title">四年级英语大闯关</h1>
    <p class="subtitle">V1.0 — 学习英语，快乐闯关！</p>

    <input type="text" class="name-input" id="playerName" placeholder="输入你的名字" maxlength="12">

    <div class="info-card">
      <h3>🎮 游戏说明</h3>
      <ul>
        <li><span class="icon">🔊</span> 真人发音，点击可重复播放</li>
        <li><span class="icon">📝</span> 四选一答题，随机抽题</li>
        <li><span class="icon">⭐</span> 连续答对获得连击奖励</li>
        <li><span class="icon">❤️</span> 3条生命，答错扣血</li>
        <li><span class="icon">🏆</span> 答题解锁各种勋章</li>
        <li><span class="icon">📚</span> 300+题库，涵盖12大类别</li>
      </ul>
    </div>

    <div class="difficulty-row">
      <button class="diff-btn active" data-diff="easy">简单 10题</button>
      <button class="diff-btn" data-diff="medium">中等 20题</button>
      <button class="diff-btn" data-diff="hard">困难 30题</button>
    </div>

    <button class="start-btn" id="startBtn">🚀 开始闯关</button>
  </div>

  <!-- ===== 游戏画面 ===== -->
  <div id="gameScreen" class="screen hidden">
    <div class="top-bar">
      <div class="stat-item"><span class="stat-icon">⭐</span><span id="scoreVal">0</span></div>
      <div class="stat-item"><span class="stat-icon">🔥</span>连击 <span id="comboVal">0</span></div>
      <div class="stat-item lives" id="livesDisplay">
        <span class="life">❤️</span><span class="life">❤️</span><span class="life">❤️</span>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

    <div class="question-area">
      <div class="category-badge" id="catBadge">类别</div>
      <div class="qtype-badge" id="qtypeBadge">题型</div>
      <div class="question-card" id="qCard">
        <div class="q-emoji" id="qEmoji" style="display:none"></div>
        <div class="q-text" id="qText"></div>
        <div class="q-hint" id="qHint"></div>
        <button class="speak-btn" id="speakBtn">🔊 点击播放</button>
      </div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
  </div>

  <!-- ===== 结束画面 ===== -->
  <div id="endScreen" class="screen hidden">
    <div class="end-icon" id="endIcon">🎉</div>
    <h2 class="end-title" id="endTitle">闯关成功！</h2>
    <div class="stars" id="endStars"></div>
    <div class="score-display">
      <div class="final-score" id="finalScore">0</div>
      <div class="score-label">总得分</div>
      <div class="stats-row">
        <div class="stat-box"><div class="val" id="statCorrect">0</div><div class="lbl">答对</div></div>
        <div class="stat-box"><div class="val" id="statTotal">0</div><div class="lbl">总题</div></div>
        <div class="stat-box"><div class="val" id="statMaxCombo">0</div><div class="lbl">最高连击</div></div>
        <div class="stat-box"><div class="val" id="statAccuracy">0%</div><div class="lbl">正确率</div></div>
      </div>
    </div>
    <div class="badges-section">
      <div class="badges-title">🏆 勋章成就</div>
      <div class="badges-grid" id="badgesGrid"></div>
    </div>
    <button class="replay-btn" id="replayBtn">🔄 再玩一次</button>
  </div>

  <!-- 反馈动画层 -->
  <div class="feedback" id="feedback"></div>
  <div class="combo-float" id="comboFloat"></div>
</div>

<script>
/* ============================================================
 * 四年级英语大闯关 V1.0
 * 题库 + 游戏逻辑 + 音效系统 + 动画
 * ============================================================ */

/* ===== 题库数据 ===== */

    {en:'gray',zh:'灰色',emoji:'⬜'},{en:'gold',zh:'金色',emoji:'🟨'},

/* ===== 音效系统（Web Audio API） ===== */
function initAudio(){
  if(!G.audioCtx){
    try{ G.audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(G.audioCtx && G.audioCtx.state==='suspended') G.audioCtx.resume();
}

function playTone(freq, duration, type='sine', vol=0.15, delay=0){
  if(!G.audioCtx) return;
  const osc = G.audioCtx.createOscillator();
  const gain = G.audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  const t = G.audioCtx.currentTime + delay;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
  osc.connect(gain); gain.connect(G.audioCtx.destination);
  osc.start(t); osc.stop(t+duration);
}

let synthVoices = [];
function loadVoices(){
  synthVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  G.voicesLoaded = synthVoices.length > 0;
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.8;
  u.pitch = 1.1;
  const enVoice = synthVoices.find(v=>v.lang.startsWith('en'));
  if(enVoice) u.voice = enVoice;
  window.speechSynthesis.speak(u);
  // 播放按钮动画
  const btn = document.getElementById('speakBtn');
  if(btn){ btn.classList.add('playing'); u.onend = ()=>btn.classList.remove('playing'); u.onerror = ()=>btn.classList.remove('playing'); }
}

/* ===== 题目生成器 ===== */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function pickRandom(arr, n){
  return shuffle([...arr]).slice(0, n);
}

function generateQuestions(count){
  const allWords = [];
  const catNames = Object.keys(wordBank);
  for(const cat of catNames){
    for(const w of wordBank[cat]){
      allWords.push({...w, category:cat});
    }
  }

  const questions = [];
  const usedIndices = new Set();
  let attempts = 0;
  const totalPool = allWords.length + sentenceBank.length;

  while(questions.length < count && attempts < count * 10){
    attempts++;
    const useSentence = Math.random() < 0.2 && sentenceBank.length > 0;

    if(useSentence){
      // 句子题
      const idx = Math.floor(Math.random()*sentenceBank.length);
      const s = sentenceBank[idx];
      const distractors = pickRandom(sentenceBank.filter(x=>x!==s), 3).map(x=>x.zh);
      const options = shuffle([s.zh, ...distractors]);
      questions.push({
        type:'sentence', category:'📖 句子',
        english:s.en, chinese:s.zh,
        options, answer:s.zh,
        emoji:null,
      });
    } else {
      // 单词题
      const idx = Math.floor(Math.random()*allWords.length);
      if(usedIndices.has(idx) && attempts < count*5) continue;
      usedIndices.add(idx);
      const w = allWords[idx];

      // 随机选择题型
      const types = ['word','image','listening'];
      const type = types[Math.floor(Math.random()*types.length)];

      // 生成干扰项（同类优先）
      let pool = wordBank[w.category].filter(x=>x.en!==w.en);
      if(pool.length < 3){
        pool = allWords.filter(x=>x.en!==w.en);
      }
      const distractors = pickRandom(pool, 3);

      if(type === 'word'){
        // 看英文选中文
        const options = shuffle([w.zh, ...distractors.map(d=>d.zh)]);
        questions.push({
          type:'word', category:w.category,
          english:w.en, chinese:w.zh,
          options, answer:w.zh,
          emoji:w.emoji,
        });
      } else if(type === 'image'){
        // 看图片选英文
        const options = shuffle([w.en, ...distractors.map(d=>d.en)]);
        questions.push({
          type:'image', category:w.category,
          english:w.en, chinese:w.zh,
          options, answer:w.en,
          emoji:w.emoji,
        });
      } else {
        // 听力题
        const options = shuffle([w.en, ...distractors.map(d=>d.en)]);
        questions.push({
          type:'listening', category:w.category,
          english:w.en, chinese:w.zh,
          options, answer:w.en,
          emoji:null,
        });
      }
    }
  }
  return questions;
}

};

const catColors = {
  '🍎 水果':'#FF6B6B','🐱 动物':'#FF9F43','🎨 颜色':'#9B59B6','🔢 数字':'#3498DB',
  '👨‍👩‍👧‍👦 家庭':'#E84393','🍔 食物':'#E17055','👤 身体':'#00B894','👷 职业':'#6C5CE7',
  '✏️ 文具':'#FDCB6E','🌤️ 天气':'#74B9FF','🏫 学校':'#0984E3','👕 服装':'#A29BFE',
  '🏃 动作':'#FD79A8','📖 句子':'#55A3FF',
};

function renderQuestion(){
  const q = G.currentQ;
  G.answeredThisQ = false;
  G.qStartTime = Date.now();

  // 类别和题型
  const catBadge = document.getElementById('catBadge');
  catBadge.textContent = q.category;
  catBadge.style.background = catColors[q.category] || '#888';

  const qtypeBadge = document.getElementById('qtypeBadge');
  qtypeBadge.textContent = typeLabels[q.type] || '题目';
  qtypeBadge.style.background = 'rgba(85,163,255,.2)';
  qtypeBadge.style.color = '#2980B9';

  // 题目内容
  const qEmoji = document.getElementById('qEmoji');
  const qText = document.getElementById('qText');
  const qHint = document.getElementById('qHint');
  const qCard = document.getElementById('qCard');
  qCard.classList.remove('correct-flash','wrong-shake');

  if(q.type === 'image'){
    qEmoji.textContent = q.emoji;
    qEmoji.style.display = 'block';
    qText.textContent = '这是什么？';
    qHint.textContent = '选择正确的英文单词';
    qText.style.fontSize = '1.4em';
  } else if(q.type === 'listening'){
    qEmoji.textContent = '🎧';
    qEmoji.style.display = 'block';
    qText.textContent = '仔细听…';
    qHint.textContent = '选择你听到的英文单词';
    qText.style.fontSize = '1.4em';
  } else if(q.type === 'sentence'){
    qEmoji.textContent = '📖';
    qEmoji.style.display = 'block';
    qText.textContent = q.english;
    qHint.textContent = '选择正确的中文意思';
    qText.style.fontSize = '1.5em';
  } else {
    // word
    qEmoji.textContent = q.emoji || '📝';
    qEmoji.style.display = 'block';
    qText.textContent = q.english;
    qHint.textContent = '选择正确的中文意思';
    qText.style.fontSize = '2em';
  }

  // 选项
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = ()=>handleAnswer(btn, opt);
    grid.appendChild(btn);
  });

  // 自动播放语音
  if(q.type !== 'image'){
    setTimeout(()=>speak(q.english), 400);
  }

  updateStats();
}

function handleAnswer(btn, selected){
  if(G.answeredThisQ) return;
  G.answeredThisQ = true;

  const q = G.currentQ;
  const isCorrect = selected === q.answer;
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b=>b.classList.add('disabled'));

  if(isCorrect){
    btn.classList.add('correct');
    document.getElementById('qCard').classList.add('correct-flash');
    G.correctCount++;
    G.combo++;
    if(G.combo > G.maxCombo) G.maxCombo = G.combo;

    // 计分：基础10分 + 连击奖励
    let points = 10;
    if(G.combo >= 3) points += 5;
    if(G.combo >= 5) points += 5;
    if(G.combo >= 10) points += 10;
    if(G.difficulty === 'medium') points = Math.round(points*1.5);
    if(G.difficulty === 'hard') points = Math.round(points*2);
    G.score += points;

    // 快速答题检测
    const elapsed = (Date.now() - G.qStartTime) / 1000;
    if(elapsed < 3) G.fastAnswers++;

    // 音效
    if(G.combo >= 5 && G.combo % 5 === 0){
      sfx.combo();
      showComboFloat(`${G.combo}连击！+${points}`);
    } else {
      sfx.correct();
    }

    // 粒子效果
    spawnParticles(btn);

    // 勋章检测
    checkBadges();

    // 下一题
    setTimeout(()=>nextQuestion(), 1200);
  } else {
    btn.classList.add('wrong');
    document.getElementById('qCard').classList.add('wrong-shake');
    G.combo = 0;
    G.lives--;
    sfx.wrong();

    // 显示正确答案
    allBtns.forEach(b=>{
      if(b.textContent === q.answer) b.classList.add('correct');
    });

    // 生命值动画
    const lifeEls = document.querySelectorAll('#livesDisplay .life');
    if(G.lives < lifeEls.length){
      const lostLife = lifeEls[G.lives];
      lostLife.style.animation = 'heartBreak .5s ease forwards';
    }

    showFeedback('❌');

    if(G.lives <= 0){
      setTimeout(()=>endGame(false), 1500);
    } else {
      setTimeout(()=>nextQuestion(), 1800);
    }
  }
  updateStats();
}

function showFeedback(emoji){
  const el = document.getElementById('feedback');
  el.textContent = emoji === '❌' ? '❌' : '✅';
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function showComboFloat(text){
  const el = document.getElementById('comboFloat');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function spawnParticles(btn){
  const container = document.getElementById('particles');
  const emojis = ['⭐','✨','🎉','💫','🌟'];
  const rect = btn.getBoundingClientRect();
  const containerRect = container.getBoundingClientRect();
  const cx = rect.left + rect.width/2 - containerRect.left;
  const cy = rect.top + rect.height/2 - containerRect.top;

  for(let i=0;i<8;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--tx', (Math.random()*200-100) + 'px');
    p.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
    container.appendChild(p);
    setTimeout(()=>p.remove(), 1200);
  }
}

function nextQuestion(){
  G.currentIdx++;
  if(G.currentIdx >= G.totalQuestions){
    endGame(true);
    return;
  }
  G.currentQ = G.questionQueue[G.currentIdx];
  renderQuestion();
}

/* ===== 勋章系统 ===== */
function unlockBadge(id){
  if(G.unlockedBadges.has(id)) return;
  G.unlockedBadges.add(id);
  sfx.badge();
  const def = badgeDefs.find(b=>b.id===id);
  if(def){
    showComboFloat(`🏅 ${def.name}解锁！`);
  }
}

function checkBadges(){
  if(G.correctCount >= 1) unlockBadge('first');
  if(G.combo >= 5) unlockBadge('combo5');
  if(G.combo >= 10) unlockBadge('combo10');
  if(G.fastAnswers >= 5) unlockBadge('speed');
  if(G.score >= 500) unlockBadge('score500');
}

/* ===== 游戏开始/结束 ===== */
function startGame(){
  initAudio();
  G.score = 0;
  G.combo = 0;
  G.maxCombo = 0;
  G.lives = 3;
  G.correctCount = 0;
  G.currentIdx = 0;
  G.fastAnswers = 0;
  G.unlockedBadges = new Set();
  G.questionQueue = generateQuestions(G.totalQuestions);
  G.currentQ = G.questionQueue[0];
  showScreen('gameScreen');
  renderQuestion();
}

function endGame(completed){
  // 通关勋章
  if(completed){
    if(G.correctCount === G.totalQuestions) unlockBadge('perfect');
    if(G.lives === 3) unlockBadge('survive');
    if(G.difficulty === 'hard' && completed) unlockBadge('nohint');
  }

  sfx.levelup();

  // 结束画面数据
  const accuracy = G.totalQuestions > 0 ? Math.round(G.correctCount / G.totalQuestions * 100) : 0;
  document.getElementById('finalScore').textContent = G.score;
  document.getElementById('statCorrect').textContent = G.correctCount;
  document.getElementById('statTotal').textContent = G.totalQuestions;
  document.getElementById('statMaxCombo').textContent = G.maxCombo;
  document.getElementById('statAccuracy').textContent = accuracy + '%';

  // 星级评价
  let stars = 1;
  if(accuracy >= 60) stars = 2;
  if(accuracy >= 85) stars = 3;
  if(!completed) stars = 0;

  const starsEl = document.getElementById('endStars');
  starsEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const s = document.createElement('span');
    s.className = 'star' + (i < stars ? '' : ' empty');
    s.textContent = i < stars ? '⭐' : '☆';
    starsEl.appendChild(s);
  }

  // 标题和图标
  const endIcon = document.getElementById('endIcon');
  const endTitle = document.getElementById('endTitle');
  if(!completed){
    endIcon.textContent = '💔';
    endTitle.textContent = '再接再厉！';
  } else if(stars === 3){
    endIcon.textContent = '🏆';
    endTitle.textContent = '太棒了，满分通关！';
  } else if(stars === 2){
    endIcon.textContent = '🎉';
    endTitle.textContent = '闯关成功！';
  } else {
    endIcon.textContent = '😊';
    endTitle.textContent = '继续努力！';
  }

  // 勋章显示
  const badgesGrid = document.getElementById('badgesGrid');
  badgesGrid.innerHTML = '';
  badgeDefs.forEach(b=>{
    const el = document.createElement('div');
    const unlocked = G.unlockedBadges.has(b.id);
    el.className = 'badge ' + (unlocked ? 'unlocked' : 'locked');
    el.innerHTML = `<div class="b-icon">${b.icon}</div><div class="b-name">${b.name}</div>`;
    el.title = b.desc;
    badgesGrid.appendChild(el);
  });

  showScreen('endScreen');
}

/* ===== 事件绑定 ===== */
document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    G.difficulty = btn.dataset.diff;
    G.totalQuestions = {easy:10, medium:20, hard:30}[G.difficulty];
    initAudio();
    sfx.click();
  };
});

document.getElementById('startBtn').onclick = ()=>{
  G.playerName = document.getElementById('playerName').value.trim() || '小勇士';
  sfx.click();
  startGame();
};

document.getElementById('speakBtn').onclick = ()=>{
  if(G.currentQ && G.currentQ.english){
    speak(G.currentQ.english);
  }
};

document.getElementById('replayBtn').onclick = ()=>{
  sfx.click();
  showScreen('startScreen');
};

// 键盘快捷键 1234选答案
document.addEventListener('keydown', e=>{
  if(document.getElementById('gameScreen').classList.contains('hidden')) return;
  const key = parseInt(e.key);
  if(key >= 1 && key <= 4){
    const btns = document.querySelectorAll('.option-btn:not(.disabled)');
    if(btns[key-1]) btns[key-1].click();
  }
  if(e.key === ' '){
    e.preventDefault();
    if(G.currentQ && G.currentQ.english) speak(G.currentQ.english);
  }
});

// 初始化语音
window.addEventListener('load', ()=>{
  setTimeout(loadVoices, 500);
});

// 调试接口
window._G = G;
</script>
</body>
</html>
